plugins {
  id 'com.android.application'
}

android {
  namespace 'pl.olxpanel.app'
  compileSdk 34

  defaultConfig {
    applicationId "pl.olxpanel.app"
    minSdk 24
    targetSdk 34
    versionCode 1
    versionName "1.0"
  }

  // Podpis release'owy wlacza sie sam, gdy w gradle.properties (albo przez -P)
  // podasz sciezke do keystore. Bez tego budujemy tylko debug.
  signingConfigs {
    if (project.hasProperty('OLX_KEYSTORE_FILE')) {
      release {
        storeFile file(project.property('OLX_KEYSTORE_FILE'))
        storePassword project.property('OLX_KEYSTORE_PASSWORD')
        keyAlias project.property('OLX_KEY_ALIAS')
        keyPassword project.property('OLX_KEY_PASSWORD')
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      if (project.hasProperty('OLX_KEYSTORE_FILE')) {
        signingConfig signingConfigs.release
      }
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
  implementation 'androidx.webkit:webkit:1.11.0'
  implementation 'androidx.core:core:1.13.1'
}

/*
 * Panel jest jeden - aplikacja nosi w sobie te same pliki, ktore serwuje
 * wersja serwerowa. Kopiujemy je do generowanego katalogu assets,
 * zeby zrodla nie dublowaly sie w repozytorium.
 */
def panelDir = file("${rootDir}/../olx-panel")

def generatedAssets = layout.buildDirectory.dir('generated/panelAssets')

def syncPanelAssets = tasks.register('syncPanelAssets', Copy) {
  description = 'Kopiuje pliki panelu do assets aplikacji'
  from(file("${panelDir}/public")) { into 'panel' }
  from(file("${panelDir}/shared")) { into 'panel/shared' }
  // service worker jest potrzebny tylko wersji przegladarkowej
  exclude 'sw.js'
  into generatedAssets
}

android.sourceSets.main.assets.srcDirs += generatedAssets

// Katalog jest generowany, wiec kazde zadanie ktore go czyta - scalanie assets
// oraz lint - musi poczekac na kopiowanie. Inaczej Gradle slusznie protestuje.
tasks.matching {
  it.name != 'syncPanelAssets'
      && (it.name.toLowerCase().contains('assets') || it.name.toLowerCase().contains('lint'))
}.configureEach {
  dependsOn syncPanelAssets
}
