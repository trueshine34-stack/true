apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "com.polybot.btc5m"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.polybot.btc5m"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 174
        versionName "18.8"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        // One key, kept in the repository, used by every build.
        //
        // Android refuses to install an update signed by a different key, so the
        // only way forward is to uninstall — which wipes the app's data, and with
        // it the sealed signing key. The debug key is generated per machine, so a
        // build from a fresh environment was a different signature every time,
        // and every update meant entering the wallet key again. A fixed key ends
        // that.
        //
        // It is a self-signed key for a hand-installed personal app, not a store
        // identity: what it buys is continuity of app data, and what it costs is
        // that anyone holding this repository can sign a build Android will treat
        // as this app.
        polybot {
            storeFile file('../keystore/polybot.jks')
            storePassword 'polybot'
            keyAlias 'polybot'
            keyPassword 'polybot'
        }
        release {
            def storePath = System.getenv("POLYBOT_KEYSTORE_FILE")
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv("POLYBOT_KEYSTORE_PASSWORD")
                keyAlias System.getenv("POLYBOT_KEY_ALIAS")
                keyPassword System.getenv("POLYBOT_KEY_PASSWORD")
            }
        }
    }
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
    kotlin {
        jvmToolchain(21)
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.polybot
        }
        release {
            // Sign with the supplied keystore when one is configured, otherwise
            // fall back to the app's own key so updates install over each other.
            signingConfig System.getenv("POLYBOT_KEYSTORE_FILE") ? signingConfigs.release : signingConfigs.polybot
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion"
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    implementation "org.bouncycastle:bcprov-jdk18on:$bouncyCastleVersion"
    testImplementation "junit:junit:$junitVersion"
    // Real org.json on the JVM; the android.jar stub throws on every call.
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
