name: TG Poster Android

on:
  push:
    paths:
      - 'tgposter/**'
      - '.github/workflows/tgposter-android.yml'
  pull_request:
    paths:
      - 'tgposter/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tgposter

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tgposter-release-apk
          path: tgposter/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
