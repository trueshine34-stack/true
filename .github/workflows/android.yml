name: Build APK

on:
  push:
    paths:
      - 'pokercraft-sync/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pokercraft-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Run tests
        run: ./gradlew :parser:test :app:testDebugUnitTest --no-daemon

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: plovault-apk
          path: |
            pokercraft-sync/app/build/outputs/apk/debug/app-debug.apk
            pokercraft-sync/app/build/outputs/apk/release/app-release.apk
