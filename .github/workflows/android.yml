name: Android

on:
  push:
    paths:
      - 'dressrent-app/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'dressrent-app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dressrent-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build release APK
        run: ./gradlew assembleRelease --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DressRentStudio-apk
          path: dressrent-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
