name: Build APK

on:
  push:
    paths:
      # Файлы панели попадают внутрь APK, поэтому их правки тоже пересобирают приложение
      - 'olx-panel-android/**'
      - 'olx-panel/public/**'
      - 'olx-panel/shared/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: olx-panel-android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Проверить, что панель отдаётся из assets
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Собрать debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Проверить статическим анализом
        run: ./gradlew --no-daemon lintDebug

      - name: Выложить APK артефактом
        uses: actions/upload-artifact@v4
        with:
          name: olx-panel-debug-apk
          path: olx-panel-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
