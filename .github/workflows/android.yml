name: Android apps

on:
  push:
    paths:
      - 'tgposter/**'
      - 'threadsposter/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'tgposter/**'
      - 'threadsposter/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [tgposter, threadsposter]
    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-release-apk
          path: ${{ matrix.app }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
